server:
  port: 8082

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:h2:mem:notifications
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  grpc:
    server:
      port: 9090

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
