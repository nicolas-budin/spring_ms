<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${user.name})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<div class="alert error" th:if="${error}" th:text="${error}"></div>

<section>
    <h2 th:text="${user.name}">Nom</h2>
    <dl class="details">
        <dt>Email</dt>
        <dd th:text="${user.email}"></dd>
        <dt>Créé le</dt>
        <dd th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm:ss')}"></dd>
        <dt>Notifications (gRPC)</dt>
        <dd><strong th:text="${user.notificationCount != null ? user.notificationCount : 'indisponible'}"></strong></dd>
    </dl>
    <form th:action="@{/users/{id}/delete(id=${user.id})}" method="post"
          onsubmit="return confirm('Supprimer cet utilisateur et ses notifications ?')">
        <button type="submit" class="danger">Supprimer</button>
    </form>
</section>

<section>
    <h2>Notifications <small class="badge">(notification-service)</small></h2>
    <div class="table-wrap">
    <table>
        <thead><tr><th>#</th><th>Message</th><th>Date</th></tr></thead>
        <tbody>
        <tr th:each="n : ${notifications}">
            <td th:text="${n.id}"></td>
            <td th:text="${n.message}"></td>
            <td th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm:ss')}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(notifications)}"><td class="empty" colspan="3">Aucune notification</td></tr>
        </tbody>
    </table>
    </div>
    <p><a th:href="@{/}">← Retour</a></p>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
