# Grafana : dashboard « Spring MS » alimenté par Prometheus.
# Grafana lit sa configuration au démarrage : après une modification d'une ConfigMap,
# redémarrer le pod (oc rollout restart deploy/grafana).

# Copie de observability/grafana/provisioning/datasources/prometheus.yml (utilisé par docker-compose) : si tu modifies l'un, modifie l'autre.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app: grafana
data:
  prometheus.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        jsonData:
          timeInterval: 5s
---
# Copie de observability/grafana/provisioning/dashboards/dashboards.yml (utilisé par docker-compose) : si tu modifies l'un, modifie l'autre.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  labels:
    app: grafana
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: spring-ms
        folder: Spring MS
        type: file
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
# Copie de observability/grafana/dashboards/spring-ms.json (utilisé par docker-compose) : si tu modifies l'un, modifie l'autre.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    app: grafana
data:
  spring-ms.json: |
    {
      "uid": "spring-ms",
      "title": "Spring MS",
      "tags": [
        "spring-ms"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "application",
            "label": "Service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(process_uptime_seconds, application)",
              "refId": "A"
            },
            "definition": "label_values(process_uptime_seconds, application)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "refresh": 2,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Services",
          "description": "État de la collecte Prometheus pour chaque service",
          "id": 1,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN"
                    },
                    "1": {
                      "text": "UP"
                    }
                  }
                }
              ],
              "color": {
                "mode": "thresholds",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "up{job=\"spring-ms\"}",
              "legendFormat": "{{service}}",
              "refId": "A",
              "instant": true
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Requêtes REST / s",
          "description": "Par service et code HTTP : les erreurs apparaissent en 4xx / 5xx",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (application, status) (rate(http_server_requests_seconds_count{application=~\"$application\", uri!~\"/actuator.*\"}[$__rate_interval]))",
              "legendFormat": "{{application}} {{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Latence REST p95",
          "description": "",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, application) (rate(http_server_requests_seconds_bucket{application=~\"$application\", uri!~\"/actuator.*\"}[$__rate_interval])))",
              "legendFormat": "{{application}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Appels gRPC / s (user-service → notification-service)",
          "description": "Vu côté client ; UNAVAILABLE = notification-service injoignable",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (rpc_method, grpc_status_code) (rate(grpc_client_seconds_count[$__rate_interval]))",
              "legendFormat": "{{rpc_method}} {{grpc_status_code}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Latence gRPC p95",
          "description": "",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, rpc_method) (rate(grpc_client_seconds_bucket[$__rate_interval])))",
              "legendFormat": "{{rpc_method}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Messages RabbitMQ / s (user.deleted)",
          "description": "Publication (RabbitTemplate) côté user-service, consommation (@RabbitListener) côté notification-service",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (application, error) (rate(spring_rabbit_template_seconds_count[$__rate_interval]))",
              "legendFormat": "publiés par {{application}} {{error}}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (application, error) (rate(spring_rabbit_listener_seconds_count[$__rate_interval]))",
              "legendFormat": "consommés par {{application}} {{error}}",
              "refId": "B"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.2.5
          ports:
            - name: http
              containerPort: 3000
          env:                       # mêmes réglages que dans docker-compose
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/spring-ms.json
            # URL publique (la Route) : Grafana s'en sert pour ses redirections et ses liens
            - name: GF_SERVER_ROOT_URL
              value: https://grafana-spring-ms.apps-crc.testing
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            # Données de Grafana (base SQLite, sessions) : emptyDir, inscriptible par l'utilisateur aléatoire
            - name: data
              mountPath: /var/lib/grafana
            # Provisioning : la source de données Prometheus et l'emplacement des dashboards
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            # Le dashboard lui-même, à l'endroit indiqué par dashboards.yml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: data
          emptyDir: {}
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  to:
    kind: Service
    name: grafana
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
