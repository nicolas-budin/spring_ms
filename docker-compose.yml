services:
  rabbitmq:
    image: rabbitmq:4.3.7-management
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # console web (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8082:8082" # REST + Swagger
      - "9090:9090" # gRPC
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_GRPC_CLIENT_CHANNEL_NOTIFICATION_TARGET: static://notification-service:9090
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
      notification-service:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      # 8080 est souvent déjà pris (ex. Keycloak) : port hôte surchargeable via FRONTEND_PORT
      - "${FRONTEND_PORT:-8088}:8080"
    environment:
      # Appels serveur à serveur : noms DNS du réseau compose
      SERVICES_USER_URL: http://user-service:8081
      SERVICES_NOTIFICATION_URL: http://notification-service:8082
      # Liens Swagger affichés dans le navigateur : ports publiés sur l'hôte
      SERVICES_USER_SWAGGERURL: http://localhost:8081/swagger-ui.html
      SERVICES_NOTIFICATION_SWAGGERURL: http://localhost:8082/swagger-ui.html
    depends_on:
      - user-service
      - notification-service

  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "9091:9090" # 9090 est déjà pris par le gRPC de notification-service
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - frontend
      - user-service
      - notification-service

  grafana:
    image: grafana/grafana:13.2.5
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/spring-ms.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
